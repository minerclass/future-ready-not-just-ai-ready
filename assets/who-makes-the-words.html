<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who makes the words? (animation source)</title>
<style>
  html,body{margin:0;background:#1E2328;}
  svg{display:block;width:1920px;height:1080px;}
  text{font-family:Inter,"Segoe UI",system-ui,sans-serif;}
  .mono{font-family:"DejaVu Sans Mono","Cascadia Mono",Consolas,monospace;}
  .serif{font-family:"Bitstream Charter",Charter,Georgia,serif;}
</style>
</head>
<body>
<!-- Frame-by-frame source for assets/who-makes-the-words.mp4 (22 s, silent).
     Open with #12.5 to preview any moment. render(t) is deterministic. -->
<svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="1080" fill="#1E2328"/>
  <g id="dust"></g>
  <text id="eyebrow" class="mono" x="150" y="118" font-size="22" letter-spacing="5" font-weight="700" fill="#56C7D2">FIVE STAGES · WHO MAKES THE WORDS</text>
  <text id="title1" x="146" y="198" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#EFEBE2">Who makes the words?</text>
  <g id="title2" opacity="0">
    <text x="146" y="198" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#EFEBE2">Same screen.<tspan class="serif" font-style="italic" font-weight="400" fill="#E8825F"> Who made the words?</tspan></text>
  </g>
  <g id="cols"></g>
  <g id="brackets"></g>
  <!-- footer like the opening video -->
  <line x1="48" y1="1010" x2="1872" y2="1010" stroke="#3A4148" stroke-width="2"/>
  <line id="prog" x1="48" y1="1010" x2="48" y2="1010" stroke="#E8825F" stroke-width="2"/>
  <text id="timer" class="mono" x="48" y="1046" font-size="20" letter-spacing="1" fill="#AFB6BC">00:00 / 00:22</text>
  <text class="mono" x="1872" y="1046" font-size="20" letter-spacing="3" text-anchor="end" fill="#AFB6BC">FUTURE READY, NOT JUST AI READY</text>
  <rect id="fade" width="1920" height="1080" fill="#1E2328"/>
</svg>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg', $=function(id){return document.getElementById(id);};
  function el(tag, a, parent, text){ var e=document.createElementNS(NS,tag); for(var k in a) e.setAttribute(k,a[k]); if(text!=null) e.textContent=text; (parent||$('s')).appendChild(e); return e; }
  var clamp=function(x,a,b){return Math.max(a,Math.min(b,x));}, prog=function(t,a,b){return clamp((t-a)/(b-a),0,1);};
  var ease=function(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;};
  var lerp=function(a,b,x){return a+(b-a)*x;};

  // dust (seeded)
  var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
  var dust=[]; for(var i=0;i<46;i++){ dust.push({x:rnd()*1920,y:rnd()*980,r:1+rnd()*1.8,v:6+rnd()*10,e:el('circle',{r:1,fill:'#56C7D2',opacity:0.18},$('dust'))}); }

  var CX=[300,630,960,1290,1620], T=[1.6,4.2,6.8,9.4,12.0];
  var names=[['Primary','orality'],['Literacy',''],['Secondary','orality'],['Algorithmic','secondary orality'],['Tertiary','algorithmicity']];
  var examples=['speech and memory','writing and print','radio, TV, telephone','social media feeds','generative AI'];
  var cols=[];

  function cell(parent, cx, y, label){
    var g=el('g',{},parent);
    var r=el('rect',{x:cx-150,y:y,width:300,height:68,rx:5,'stroke-width':2.5},g);
    var t=el('text',{x:cx,y:y+42,'font-size':23,'font-weight':700,'text-anchor':'middle'},g,'');
    return {g:g,r:r,t:t,label:label,y:y};
  }
  function paintCell(c, who){
    if(who==='people'){ c.r.setAttribute('fill','rgba(232,130,95,0.14)'); c.r.setAttribute('stroke','#E8825F'); c.t.setAttribute('fill','#E8825F'); c.t.textContent=c.label+' people'; }
    else { c.r.setAttribute('fill','#0E6E78'); c.r.setAttribute('stroke','#56C7D2'); c.t.setAttribute('fill','#FFFFFF'); c.t.textContent=c.label+' an algorithm'; }
  }

  for(var k=0;k<5;k++){
    var cx=CX[k], g=el('g',{opacity:0},$('cols'));
    var icon=el('g',{},g);
    var nm=el('g',{},g);
    if(names[k][1]){ el('text',{x:cx,y:572,'font-size':34,'font-weight':800,'text-anchor':'middle',fill:'#EFEBE2'},nm,names[k][0]); el('text',{x:cx,y:612,'font-size':34,'font-weight':800,'text-anchor':'middle',fill:'#EFEBE2'},nm,names[k][1]); }
    else el('text',{x:cx,y:592,'font-size':34,'font-weight':800,'text-anchor':'middle',fill:'#EFEBE2'},nm,names[k][0]);
    el('text',{x:cx,y:660,'font-size':26,'font-style':'italic','text-anchor':'middle',fill:'#AFB6BC','class':'serif'},nm,examples[k]);
    var made=cell(g,cx,700,'made by'), chosen=cell(g,cx,786,'chosen by');
    cols.push({g:g,icon:icon,nm:nm,made:made,chosen:chosen,parts:{}});
  }

  // ---- icons ----
  // 0: two people talking
  (function(c,cx){ var g=c.icon;
    [[-78,1],[78,-1]].forEach(function(p){ el('circle',{cx:cx+p[0],cy:400,r:30,fill:'none',stroke:'#E8825F','stroke-width':6},g); el('path',{d:'M'+(cx+p[0]-48)+' 488 Q'+(cx+p[0])+' 430 '+(cx+p[0]+48)+' 488',fill:'none',stroke:'#E8825F','stroke-width':6,'stroke-linecap':'round'},g); });
    el('path',{d:'M'+(cx-50)+' 300 h100 a16 16 0 0 1 16 16 v34 a16 16 0 0 1 -16 16 h-38 l-14 18 l-4 -18 h-44 a16 16 0 0 1 -16 -16 v-34 a16 16 0 0 1 16 -16 z',fill:'#2A3037',stroke:'#EFEBE2','stroke-width':3},g);
    c.parts.dots=[0,1,2].map(function(i){ return el('circle',{cx:cx-24+i*24,cy:333,r:6,fill:'#EFEBE2'},g); });
  })(cols[0],CX[0]);
  // 1: page and pen
  (function(c,cx){ var g=c.icon;
    el('rect',{x:cx-72,y:298,width:144,height:192,rx:4,fill:'#EFEBE2'},g);
    c.parts.lines=[0,1,2,3,4].map(function(i){ return el('rect',{x:cx-52,y:326+i*30,width:0,height:7,rx:3,fill:'#1E2328'},g); });
    c.parts.pen=el('path',{d:'M0 0 l34 -46 l9 7 l-34 46 z M0 0 l-4 12 l13 -5 z',fill:'#E8825F'},g);
  })(cols[1],CX[1]);
  // 2: television with broadcast waves
  (function(c,cx){ var g=c.icon;
    el('path',{d:'M'+(cx-34)+' 300 L'+cx+' 330 L'+(cx+34)+' 300',fill:'none',stroke:'#EFEBE2','stroke-width':4,'stroke-linecap':'round'},g);
    el('rect',{x:cx-92,y:330,width:184,height:136,rx:12,fill:'#2A3037',stroke:'#EFEBE2','stroke-width':4},g);
    el('circle',{cx:cx,cy:380,r:20,fill:'#E8825F'},g);
    el('path',{d:'M'+(cx-36)+' 448 Q'+cx+' 400 '+(cx+36)+' 448 z',fill:'#E8825F'},g);
    el('rect',{x:cx-30,y:466,width:60,height:14,fill:'#3A4148'},g);
    c.parts.waves=[];
    [1,2].forEach(function(i){ [-1,1].forEach(function(s){ c.parts.waves.push(el('path',{d:'M'+(cx+s*(100+i*22))+' '+(370-i*14)+' Q'+(cx+s*(116+i*28))+' 398 '+(cx+s*(100+i*22))+' '+(426+i*14),fill:'none',stroke:'#EFEBE2','stroke-width':4,'stroke-linecap':'round',opacity:0},g)); }); });
  })(cols[2],CX[2]);
  // 3: phone feed of human-made posts, reranked
  (function(c,cx){ var g=c.icon;
    el('rect',{x:cx-68,y:290,width:136,height:220,rx:18,fill:'#2A3037',stroke:'#EFEBE2','stroke-width':4},g);
    c.parts.cards=[0,1,2].map(function(i){ var cg=el('g',{},g);
      el('rect',{x:cx-54,y:0,width:108,height:52,rx:6,fill:'#3A4148'},cg);
      el('circle',{cx:cx-36,cy:26,r:10,fill:'#E8825F'},cg);
      el('rect',{x:cx-20,y:16,width:[58,42,50][i],height:6,rx:3,fill:'#AFB6BC'},cg);
      el('rect',{x:cx-20,y:30,width:[40,56,34][i],height:6,rx:3,fill:'#AFB6BC'},cg);
      return cg; });
    c.parts.rank=el('rect',{x:cx-54,y:0,width:6,height:52,rx:3,fill:'#56C7D2',opacity:0},g);
  })(cols[3],CX[3]);
  // 4: a code editor that writes itself (token by token, no hands)
  (function(c,cx){ var g=c.icon;
    el('rect',{x:cx-98,y:298,width:196,height:194,rx:10,fill:'#12181C',stroke:'#56C7D2','stroke-width':3},g);
    el('path',{d:'M'+(cx-98)+' 324 v-16 a10 10 0 0 1 10 -10 h176 a10 10 0 0 1 10 10 v16 z',fill:'#2A3037'},g);
    ['#E8825F','#E0AC4A','#56C7D2'].forEach(function(col,i){ el('circle',{cx:cx-82+i*15,cy:311,r:5,fill:col},g); });
    el('text',{x:cx+86,y:316,'font-size':13,'text-anchor':'end',fill:'#AFB6BC','class':'mono'},g,'draft.py');
    var KW='#56C7D2', ID='#EFEBE2', STR='#E0AC4A', COM='#5A6168';
    var xL=cx-70, y0=342, dy=24;
    var spec=[ [[0,30,KW],[36,48,ID],[90,22,ID]],
               [[16,34,ID],[54,10,ID],[68,62,STR]],
               [[16,24,KW],[44,40,ID],[88,34,STR]],
               [[32,52,ID],[88,40,STR]],
               [[16,34,KW],[54,66,ID]],
               [[0,92,COM]] ];
    c.parts.segs=[];
    spec.forEach(function(line,li){
      el('rect',{x:cx-88,y:y0+li*dy,width:8,height:9,rx:2,fill:'#3A4148'},g);
      line.forEach(function(sg){ c.parts.segs.push({e:el('rect',{x:xL+sg[0],y:y0+li*dy,width:sg[1],height:9,rx:3,fill:sg[2],opacity:0},g), x:xL+sg[0]+sg[1], y:y0+li*dy}); });
    });
    c.parts.cursor=el('rect',{x:xL,y:y0-3,width:9,height:15,fill:'#56C7D2'},g);
  })(cols[4],CX[4]);

  // brackets
  function bracket(x1,x2,label,color){ var g=el('g',{opacity:0},$('brackets'));
    el('path',{d:'M'+x1+' 884 L'+x1+' 898 L'+x2+' 898 L'+x2+' 884',fill:'none',stroke:color,'stroke-width':3},g);
    el('text',{x:(x1+x2)/2,y:944,'font-size':22,'font-weight':700,'letter-spacing':4,'text-anchor':'middle',fill:color,'class':'mono'},g,label);
    return g; }
  var bOng=bracket(CX[0]-150,CX[2]+150,'WALTER ONG · THREE STAGES','#AFB6BC');
  var bMin=bracket(CX[3]-150,CX[4]+150,'MINER · TWO PROPOSED STAGES','#56C7D2');

  var LINE_W=[96,86,100,70,56];
  var DUR=22;

  window.render=function(t){
    dust.forEach(function(d){ d.e.setAttribute('cx',((d.x+d.v*t)%1920).toFixed(1)); d.e.setAttribute('cy',(d.y-d.v*0.4*t).toFixed(1)); d.e.setAttribute('r',d.r); });
    $('eyebrow').setAttribute('opacity',prog(t,0.2,0.8));
    var swapTitle=prog(t,17.0,17.6);
    $('title1').setAttribute('opacity',(prog(t,0.4,1.1)*(1-swapTitle)).toFixed(3));
    $('title2').setAttribute('opacity',swapTitle.toFixed(3));

    cols.forEach(function(c,k){
      var a=prog(t,T[k],T[k]+0.5);
      c.g.setAttribute('opacity',a.toFixed(3));
      c.icon.setAttribute('transform','translate(0,'+(24*(1-ease(a))).toFixed(1)+')');
      c.nm.setAttribute('opacity',prog(t,T[k]+0.3,T[k]+0.7).toFixed(3));
      var m=prog(t,T[k]+0.8,T[k]+1.1), ch=prog(t,T[k]+1.2,T[k]+1.5);
      c.made.g.setAttribute('opacity',m.toFixed(3)); c.chosen.g.setAttribute('opacity',ch.toFixed(3));
      // default ownership
      var madeWho='people', chosenWho='people';
      // stage 4: curation flips to the algorithm
      if(k===3 && t>=T[3]+1.9) chosenWho='algorithm';
      if(k===4){ chosenWho='algorithm'; if(t>=T[4]+1.9) madeWho='algorithm'; }
      paintCell(c.made,madeWho); paintCell(c.chosen,chosenWho);
      // flip squash on the change
      function squash(cellObj, at){ var x=Math.abs(t-at); var sy= x<0.18 ? Math.max(0.05, x/0.18) : 1; var cy=cellObj.y+34; cellObj.g.setAttribute('transform','translate(0,'+cy+') scale(1,'+sy.toFixed(3)+') translate(0,'+(-cy)+')'); }
      if(k===3) squash(c.chosen, T[3]+1.9);
      if(k===4) squash(c.made, T[4]+1.9);
    });

    // icon motion
    var c0=cols[0]; c0.parts.dots.forEach(function(d,i){ d.setAttribute('opacity',(0.35+0.65*Math.max(0,Math.sin(t*5-i*0.9))).toFixed(3)); });
    var c1=cols[1], w1=prog(t,T[1]+0.5,T[1]+5.0)*5;
    c1.parts.lines.forEach(function(l,i){ var f=clamp(w1-i,0,1); l.setAttribute('width',(LINE_W[i]*f).toFixed(1)); });
    var li=Math.min(4,Math.floor(w1)), lf=clamp(w1-li,0,1); var px=CX[1]-52+LINE_W[li]*lf, py=326+li*30+4;
    c1.parts.pen.setAttribute('transform','translate('+px.toFixed(1)+','+py+')');
    cols[2].parts.waves.forEach(function(w,i){ var ph=(t*1.4 - (i>1?0.35:0))%1; w.setAttribute('opacity',(t>T[2]+0.4? (0.9*(1-ph)) : 0).toFixed(3)); });
    // feed: cards rerank at T3+1.9 and again at T3+3.3
    var c3=cols[3]; var slots=[304,364,424];
    var order1=[0,1,2], order2=[2,0,1], order3=[1,2,0];
    var r1=ease(prog(t,T[3]+1.9,T[3]+2.5)), r2=ease(prog(t,T[3]+3.3,T[3]+3.9));
    c3.parts.cards.forEach(function(cg,i){
      var y=lerp(slots[order1.indexOf(i)], slots[order2.indexOf(i)], r1);
      y=lerp(y, slots[order3.indexOf(i)], r2);
      cg.setAttribute('transform','translate(0,'+y.toFixed(1)+')');
    });
    c3.parts.rank.setAttribute('opacity', t>=T[3]+1.9 ? 1 : 0);
    c3.parts.rank.setAttribute('y', 304);
    // code writes itself one token at a time; the cursor blinks at the end
    var c4=cols[4], segs=c4.parts.segs, nShown=Math.floor(prog(t,T[4]+0.7,T[4]+2.3)*segs.length);
    segs.forEach(function(sg,i){ sg.e.setAttribute('opacity', i<nShown ? 1 : 0); });
    var last = nShown>0 ? segs[nShown-1] : {x:CX[4]-70-12, y:342};
    c4.parts.cursor.setAttribute('x',(last.x+5).toFixed(1)); c4.parts.cursor.setAttribute('y',(last.y-3).toFixed(1));
    c4.parts.cursor.setAttribute('opacity', (nShown<segs.length || Math.floor(t*2.5)%2===0) ? 1 : 0);

    bOng.setAttribute('opacity',prog(t,15.0,15.6).toFixed(3));
    bMin.setAttribute('opacity',prog(t,15.6,16.2).toFixed(3));

    var p=clamp(t/DUR,0,1); $('prog').setAttribute('x2',(48+1824*p).toFixed(1));
    var sec=Math.min(22,Math.floor(t)); $('timer').textContent='00:'+(sec<10?'0':'')+sec+' / 00:22';
    $('fade').setAttribute('opacity',Math.max(0,1-t/0.4).toFixed(3));
  };
  render(location.hash ? parseFloat(location.hash.slice(1)) : 21);
})();
</script>
</body>
</html>
